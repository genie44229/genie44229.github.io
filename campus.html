<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SCH 캠퍼스 편의시설 지도</title><style>
:root{font-family:system-ui,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#1d3443;background:#f3f6f8}*{box-sizing:border-box}body{margin:0}button,input{font:inherit}button{cursor:pointer}header{background:#123c4c;color:white;padding:19px max(18px,calc((100vw - 1440px)/2));display:flex;align-items:center;justify-content:space-between;gap:16px}header strong{font-size:21px;letter-spacing:-.7px}header p{margin:5px 0 0;font-size:12px;color:#bdd3db}.layout{max-width:1440px;margin:24px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:18px;align-items:start}.card{background:white;border:1px solid #e1e9ee;border-radius:18px;box-shadow:0 8px 30px #193c4c0a;overflow:hidden}.maphead{padding:18px 20px;border-bottom:1px solid #edf1f3}.maphead h1{margin:0;font-size:18px}.maphead p{margin:6px 0 0;color:#617782;font-size:13px}.mapwrap{background:#d5e6e6;overflow:auto}.mapwrap img{width:100%;height:auto;display:block;min-width:580px}.mapfoot{padding:12px 18px;font-size:12px;color:#647a86}.side{padding:22px}.eyebrow{color:#2a8b87;font-size:11px;letter-spacing:2px;font-weight:800}.side h2{margin:6px 0;font-size:23px}.desc{font-size:13px;color:#657a86;line-height:1.65;margin:8px 0 18px}.searchbox{position:relative}.searchbox input{width:100%;border:1px solid #cddce1;border-radius:12px;padding:13px 14px;outline:none;background:#fbfdfd}.searchbox input:focus{border-color:#24968e;box-shadow:0 0 0 3px #24968e1c}.count{font-size:12px;color:#718691;margin:15px 0 9px}.list{display:grid;gap:7px;max-height:420px;overflow:auto;padding-right:3px}.item{width:100%;background:white;border:1px solid #e2eaed;border-radius:11px;padding:12px 13px;text-align:left;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#294553}.item:hover,.item:focus-visible{border-color:#36a79b;background:#f1faf8}.item.active{border-color:#168c80;background:#e9f8f4;font-weight:750}.item small{color:#81939c;white-space:nowrap;font-size:11px}.detail{margin-top:18px;padding:17px;border-radius:13px;background:#f2f8f7;border:1px solid #dcebe8}.detail h3{margin:0 0 7px;font-size:17px}.detail p{font-size:12px;color:#667c83;margin:0;line-height:1.7}.floors{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.floor{background:#147e75;border:0;border-radius:9px;color:white;padding:10px 14px;font-weight:700}.floor:hover{background:#08695f}.empty{padding:15px 0;color:#7a8b93;font-size:13px}.modal{display:none;position:fixed;inset:0;z-index:20;background:#10242bd9;padding:22px;align-items:center;justify-content:center}.modal.open{display:flex}.dialog{background:white;border-radius:18px;max-width:1100px;width:100%;max-height:94vh;overflow:auto;padding:16px}.dialoghead{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:4px 4px 14px}.close{border:0;background:#edf3f4;border-radius:9px;padding:8px 13px}.floorimage{position:relative;max-width:100%;width:max-content;margin:auto;line-height:0}.floorimage img{display:block;max-width:100%;max-height:72vh;height:auto}.pin{position:absolute;transform:translate(-50%,-50%);border:2px solid white;background:#d94246;color:white;border-radius:50%;width:24px;height:24px;box-shadow:0 2px 7px #0007;font-size:19px;line-height:12px;padding:0}.legend{font-size:12px;color:#4b6570;padding:10px 4px 2px}@media(max-width:950px){.layout{grid-template-columns:1fr}.side{padding:18px}.list{max-height:290px}header{padding:16px 20px}}@media(max-width:600px){.layout{padding:0 10px;margin:12px auto;gap:12px}.maphead{padding:15px}.mapwrap img{min-width:0;width:100%}.mapwrap{overflow:hidden}.side h2{font-size:20px}header strong{font-size:16px}.dialog{padding:10px}.modal{padding:8px}}
</style></head><body><header><div><strong>SCH 캠퍼스 편의시설 지도</strong><p>순천향대학교 · 캠퍼스 전체 안내 및 층별 시설 찾기</p></div></header><main class="layout"><section class="card"><div class="maphead"><h1>캠퍼스 전체 지도</h1><p>지도에서 위치를 확인한 뒤 오른쪽에서 건물을 검색하거나 선택하세요.</p></div><div class="mapwrap"><img src="./campus-map.jpg" alt="순천향대학교 캠퍼스 전체 조감도. 건물 이름과 배치를 보여주는 안내 지도"></div><div class="mapfoot">지도는 위치 확인용 이미지이며, 건물 선택은 오른쪽 목록에서 할 수 있어요.</div></section><aside class="card side"><div class="eyebrow">CAMPUS GUIDE</div><h2>건물 찾기</h2><p class="desc">data.json에 등록된 건물만 표시됩니다. 이름을 검색하거나 목록에서 선택해 주세요.</p><div class="searchbox"><input id="search" placeholder="건물 이름 검색 (예: 공학관)" aria-label="건물 이름 검색" autocomplete="off"></div><div class="count" id="count"></div><div class="list" id="list"></div><div class="detail" id="detail"><h3 id="selected">건물을 선택해 주세요</h3><p id="empty">data.json을 불러오는 중입니다. 잠시만 기다려 주세요.</p><div class="floors" id="floors"></div></div></aside></main><div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="dialog"><div class="dialoghead"><strong id="modaltitle">층별 편의시설</strong><button class="close" id="close" type="button">닫기 ✕</button></div><div class="floorimage" id="floorimage"></div><div class="legend" id="legend"></div></div></div><script>
let buildings=[];
let data={floors:[],pins:[]},selected=null;const $=id=>document.getElementById(id);const labels={vending:'자판기',water:'정수기',rest:'휴게공간',printer:'프린터',atm:'ATM',other:'기타'};const normalize=s=>String(s||'').toLowerCase().replace(/[^가-힣a-z0-9]/g,'');function rank(s){let m=String(s).match(/(?:지하|B)(\d+)/i);if(m)return -Number(m[1]);m=String(s).match(/\d+/);return m?Number(m[0]):999}function floorsFor(name){return data.floors.filter(f=>normalize(f.building)===normalize(name)).sort((a,b)=>rank(a.floor)-rank(b.floor)}
function renderList(){const q=normalize($('search').value);const matches=buildings.filter(b=>normalize(b).includes(q));$('count').textContent=`등록된 건물 ${buildings.length}개 · 검색 결과 ${matches.length}개`;$('list').replaceChildren();for(const name of matches){const btn=document.createElement('button');btn.type='button';btn.className='item'+(name===selected?' active':'');const label=document.createElement('span');label.textContent=name;const sub=document.createElement('small');sub.textContent=floorsFor(name).length+'개 층';btn.append(label,sub);btn.onclick=()=>choose(name);$('list').append(btn)}if(!matches.length){const e=document.createElement('div');e.className='empty';e.textContent='검색 결과가 없어요.';$('list').append(e)}}
function choose(name){selected=name;$('selected').textContent=name;const fs=floorsFor(name);$('floors').replaceChildren();$('empty').textContent=fs.length?'아래에서 층을 선택하세요.':'이 건물에는 아직 등록된 도면이 없어요. data.json에 추가하면 자동으로 표시됩니다.';for(const f of fs){const btn=document.createElement('button');btn.className='floor';btn.textContent=f.floor;btn.onclick=()=>openFloor(f);$('floors').append(btn)}renderList();if(innerWidth<=950)$('detail').scrollIntoView({behavior:'smooth',block:'nearest'})}
function openFloor(f){$('modaltitle').textContent=f.building+' · '+f.floor;const area=$('floorimage');area.replaceChildren();if(f.image){const img=document.createElement('img');img.src=f.image;img.alt=f.building+' '+f.floor+' 도면';area.append(img);const pins=data.pins.filter(p=>p.floorId===f.id);for(const p of pins){const pin=document.createElement('button');pin.className='pin';pin.style.left=(Number(p.x)*100)+'%';pin.style.top=(Number(p.y)*100)+'%';pin.textContent='•';pin.title=(labels[p.cat]||'시설')+(p.name?' · '+p.name:'');pin.setAttribute('aria-label',pin.title);pin.onclick=()=>{$('legend').textContent='선택한 시설: '+pin.title};area.append(pin)}$('legend').textContent=`● 표시를 누르면 시설 정보를 확인할 수 있어요. 등록 시설 ${pins.length}개`;}else{area.textContent='등록된 도면 이미지가 없어요.';$('legend').textContent=''}$('modal').classList.add('open');$('close').focus()}
function closeModal(){$('modal').classList.remove('open')}$('close').onclick=closeModal;$('modal').onclick=e=>{if(e.target===$('modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});$('search').addEventListener('input',renderList);
(async()=>{try{const r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);const d=await r.json();if(!Array.isArray(d.floors)||!Array.isArray(d.pins))throw Error('invalid data.json');data=d;buildings=[...new Set(d.floors.map(f=>String(f.building||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'ko'));if(!buildings.length){$('empty').textContent='등록된 건물이 없어요. 관리자 페이지에서 건물과 층을 추가하고 data.json을 업데이트해 주세요.'}}catch(e){$('empty').textContent='데이터를 불러오지 못했어요. campus.html과 data.json이 같은 폴더에 있는지 확인해 주세요.';$('count').textContent='데이터 로딩 오류';console.error(e)}renderList()})();
</script></body></html>
