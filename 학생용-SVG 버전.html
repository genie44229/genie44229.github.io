<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교내 편의시설 통합 지도</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#173e76;color:white;padding:24px max(20px,calc((100vw - 1120px)/2))}h1{margin:0 0 7px;font-size:24px}header p{margin:0;opacity:.85}main{max-width:1120px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:18px;min-width:0}h2{font-size:17px;margin:0 0 12px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 6px}select,input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin:14px 0;color:#475569}.map{min-height:350px;display:grid;place-items:center;background:#f8fafc;border:1px dashed #cad5e3;border-radius:12px;overflow:hidden;padding:10px}.stage{position:relative;width:min(100%,var(--image-width,100%));max-width:100%;line-height:0;margin:auto}.stage img{display:block;width:100%;height:auto}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:#fff;border-radius:50%;padding:var(--pin-padding,4px);cursor:pointer;font-size:var(--pin-font-size,20px);line-height:1.2;box-shadow:0 1px 7px #0004}.pin:focus-visible{outline:3px solid #2563eb}.result{display:block;width:100%;text-align:left;background:white;border:1px solid #e2e8f0;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.result:hover{background:#eff6ff}.muted{font-size:13px;color:#64748b}.message{margin-top:12px;font-size:13px;color:#334155}.notice{font-size:13px;background:#eff6ff;padding:12px;border-radius:9px;margin-bottom:15px}@media(max-width:780px){main{grid-template-columns:minmax(0,1fr);margin:12px auto;padding:0 10px;gap:10px}.card{padding:12px}.map{min-height:180px;padding:4px;display:block;text-align:center}.stage{margin:0 auto}header{padding:16px}h1{font-size:20px}.legend{font-size:12px;gap:6px;line-height:1.7;overflow-wrap:anywhere}.row{gap:8px}.pin{width:18px;height:18px;min-width:0;min-height:0;padding:0!important;font-size:0!important;line-height:0;border:3px solid #fff;border-radius:50%;background:#2563eb;box-shadow:0 0 0 1.5px #172b4d,0 2px 5px #0008;transform:translate(-50%,-50%);touch-action:manipulation;z-index:1}.pin.selected{box-shadow:0 0 0 3px #facc15,0 0 0 5px #172b4d,0 2px 6px #0008;z-index:3}.pin::after{content:"";position:absolute;inset:-14px;border-radius:50%}.pin[data-cat="water"]{background:#0891b2}.pin[data-cat="rest"]{background:#d97706}.pin[data-cat="printer"]{background:#7c3aed}.pin[data-cat="atm"]{background:#16a34a}.pin[data-cat="other"]{background:#db2777}.pin[data-cat="vending"]{background:#2563eb}.pin:focus-visible{outline:2px solid #111;outline-offset:3px}}
/* SVG icons: compact and consistent on desktop and mobile */
.pin{display:grid;place-items:center;width:28px;height:28px;padding:5px!important;border:2px solid #fff;border-radius:50%;background:var(--cat-color,#2563eb)!important;color:white;box-shadow:0 1px 5px #0006;transform:translate(-50%,-50%);line-height:1;z-index:1}
.pin svg{display:block;width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.pin.selected{outline:3px solid #facc15;outline-offset:1px;z-index:3}
.pin:focus-visible{outline:3px solid #facc15;outline-offset:2px}
.legend{display:flex;gap:9px 15px;align-items:center;flex-wrap:wrap}
.legend-item{display:inline-flex;align-items:center;gap:6px;white-space:nowrap;font-size:12px}
.legend-symbol{width:21px;height:21px;display:grid;place-items:center;border-radius:50%;background:var(--cat-color);color:white;flex:none}
.legend-symbol svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.result-icon{display:inline-grid;place-items:center;vertical-align:middle;width:22px;height:22px;border-radius:50%;color:#fff;background:var(--cat-color);margin-right:6px}
.result-icon svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:780px){.pin{width:21px;height:21px;padding:3px!important;border-width:1.5px;box-shadow:0 1px 3px #0008}.pin svg{width:13px;height:13px}.pin::after{content:"";position:absolute;inset:-9px;border-radius:50%}.legend{gap:7px 11px;margin:10px 0}.legend-item{font-size:11px}.legend-symbol{width:17px;height:17px}.legend-symbol svg{width:11px;height:11px}.notice{font-size:12px}}
</style></head><body><header><h1>교내 편의시설 통합 지도</h1><p>건물과 층을 선택해 편의시설 위치를 확인하세요.</p></header><main><aside class="card"><h2>시설 찾기</h2><input id="search" placeholder="건물·시설명 검색" aria-label="시설 검색"><div id="results"></div><p class="muted" id="count"></p></aside><section class="card"><div class="notice">학생·팀원용 열람 화면입니다. 도면과 핀 수정은 관리자용 HTML에서 진행합니다.</div><div class="row"><div><label for="building">건물</label><select id="building"></select></div><div><label for="floor">층</label><select id="floor"></select></div></div><div class="legend" id="legend"></div><div class="map" id="map"><span class="muted">도면을 불러오는 중...</span></div><p class="message" id="message" role="status"></p></section></main><script>
const labels={vending:'자판기',water:'정수기',rest:'휴게공간',printer:'프린터기',atm:'ATM기',other:'기타'};
const colors={vending:'#2563eb',water:'#0891b2',rest:'#d97706',printer:'#7c3aed',atm:'#16a34a',other:'#db2777'};
// Small self-contained vector symbols; no external icon library or internet needed.
const paths={
 vending:'<rect x="5" y="2" width="14" height="20" rx="2"/><path d="M8 6h8v6H8zM9 16h3M16 16v3"/>',
 water:'<path d="M12 2C9 7 5 10 5 15a7 7 0 0 0 14 0c0-5-4-8-7-13z"/><path d="M9 17a3 3 0 0 0 3 3"/>',
 rest:'<path d="M6 3v10h12V3M6 9h12M4 13h16v4H4zM6 17v4M18 17v4"/>',
 printer:'<path d="M6 9V3h12v6M6 18H4a2 2 0 0 1-2-2v-5a2 2 0 0 1 2-2h16a2 2 0 0 1 2 2v5a2 2 0 0 1-2 2h-2"/><path d="M6 15h12v7H6zM18 12h.01"/>',
 atm:'<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 8h10M7 12h10M12 15v4M9 17h6"/>',
 other:'<circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 0 1 5 0c0 2-2.5 2-2.5 4M12 17h.01"/>'
};
function svgIcon(cat){return '<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">'+(paths[cat]||paths.other)+'</svg>'}
function setCatColor(el,cat){el.style.setProperty('--cat-color',colors[cat]||colors.other)}
function makeLegend(){let root=document.getElementById('legend');Object.keys(labels).forEach(cat=>{let item=document.createElement('span');item.className='legend-item';let symbol=document.createElement('span');symbol.className='legend-symbol';setCatColor(symbol,cat);symbol.innerHTML=svgIcon(cat);item.append(symbol,document.createTextNode(labels[cat]));root.append(item)})}
makeLegend();
const $=id=>document.getElementById(id);let data={floors:[],pins:[]},current=null;
function floorRank(s){s=String(s||'').toLowerCase().replace(/\s+/g,'');let m=s.match(/(?:지하|b)(\d+)/);if(m)return -Number(m[1]);m=s.match(/(\d+)/);return m?Number(m[1]):999}
function sortedFloors(a){return [...a].sort((x,y)=>floorRank(x.floor)-floorRank(y.floor)||String(x.floor).localeCompare(String(y.floor),'ko'))}
function option(sel,value,text){let o=document.createElement('option');o.value=value;o.textContent=text;sel.append(o)}
function setBuilding(){let b=$('building').value,fs=sortedFloors(data.floors.filter(f=>f.building===b));$('floor').replaceChildren();fs.forEach(f=>option($('floor'),f.id,f.floor));current=fs[0]?.id||null;draw()}
function selectFloor(id){let f=data.floors.find(f=>f.id===id);if(!f)return;$('building').value=f.building;let fs=sortedFloors(data.floors.filter(x=>x.building===f.building));$('floor').replaceChildren();fs.forEach(x=>option($('floor'),x.id,x.floor));$('floor').value=id;current=id;draw()}
function draw(){const el=$('map');el.replaceChildren();let f=data.floors.find(f=>f.id===current);if(!f){el.textContent='등록된 도면이 없습니다.';return}if(!f.image){el.textContent='이 층에는 도면 이미지가 없습니다.';return}let stage=document.createElement('div');stage.className='stage';let img=document.createElement('img');img.src=f.image;img.alt=f.building+' '+f.floor+' 도면';stage.append(img);img.addEventListener('load',()=>{stage.style.setProperty('--image-width',img.naturalWidth+'px')},{once:true});data.pins.filter(p=>p.floorId===f.id).forEach(p=>{let b=document.createElement('button');b.className='pin';b.dataset.cat=p.cat||'other';b.style.left=(Number(p.x)*100)+'%';b.style.top=(Number(p.y)*100)+'%';setCatColor(b,p.cat);b.innerHTML=svgIcon(p.cat);b.title=p.name||labels[p.cat]||'기타';b.setAttribute('aria-label',b.title);b.onclick=()=>{stage.querySelectorAll('.pin.selected').forEach(n=>n.classList.remove('selected'));b.classList.add('selected');$('message').textContent='📍 '+(p.name||labels[p.cat]||'기타')+' · '+f.building+' '+f.floor};stage.append(b)});el.append(stage);$('message').textContent=f.building+' · '+f.floor}
function search(){let q=$('search').value.trim().toLocaleLowerCase('ko'),results=$('results');results.replaceChildren();let matches=data.pins.filter(p=>{let f=data.floors.find(f=>f.id===p.floorId);return f&&[p.name,labels[p.cat],f.building,f.floor].some(s=>String(s||'').toLocaleLowerCase('ko').includes(q))});$('count').textContent='검색 결과 '+matches.length+'개';matches.slice(0,100).forEach(p=>{let f=data.floors.find(f=>f.id===p.floorId);let b=document.createElement('button');b.className='result';let sym=document.createElement('span');sym.className='result-icon';setCatColor(sym,p.cat);sym.innerHTML=svgIcon(p.cat);b.append(sym,document.createTextNode((p.name||labels[p.cat]||'기타')+' — '+f.building+' '+f.floor));b.onclick=()=>selectFloor(f.id);results.append(b)});if(matches.length>100){let p=document.createElement('p');p.className='muted';p.textContent='처음 100개 결과만 표시합니다.';results.append(p)}}
$('building').onchange=setBuilding;$('floor').onchange=()=>{current=$('floor').value;draw()};$('search').oninput=search;
(async()=>{try{let r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!Array.isArray(d.floors)||!Array.isArray(d.pins))throw Error('JSON 형식이 올바르지 않습니다.');data=d;let buildings=[...new Set(data.floors.map(f=>f.building))].sort((a,b)=>a.localeCompare(b,'ko'));buildings.forEach(b=>option($('building'),b,b));if(buildings.length)setBuilding();else $('map').textContent='아직 등록된 도면이 없습니다. 관리자용 지도에서 JSON을 내보내 data.json으로 올려주세요.';search()}catch(e){$('map').textContent='data.json을 불러오지 못했습니다.';$('message').textContent='GitHub에 index.html과 data.json을 같은 위치에 올렸는지 확인하세요. ('+e.message+')'}})();
</script></body></html>
