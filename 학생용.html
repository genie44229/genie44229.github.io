<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>교내 편의시설 통합 지도</title><style>
:root{font-family:system-ui,'Malgun Gothic',sans-serif;color:#172b4d;background:#f4f7fb}*{box-sizing:border-box}body{margin:0}header{background:#173e76;color:white;padding:24px max(20px,calc((100vw - 1120px)/2))}h1{margin:0 0 7px;font-size:24px}header p{margin:0;opacity:.85}main{max-width:1120px;margin:22px auto;padding:0 16px;display:grid;grid-template-columns:280px 1fr;gap:16px}.card{background:white;border:1px solid #dce4ee;border-radius:14px;padding:18px;min-width:0}h2{font-size:17px;margin:0 0 12px}label{font-size:13px;font-weight:700;display:block;margin:10px 0 6px}select,input{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;background:white;font:inherit}.row{display:flex;gap:12px}.row>div{flex:1;min-width:0}.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:13px;margin:14px 0;color:#475569}.map{min-height:350px;display:grid;place-items:center;background:#f8fafc;border:1px dashed #cad5e3;border-radius:12px;overflow:hidden;padding:10px}.stage{position:relative;display:inline-block;max-width:100%;line-height:0}.stage img{max-width:100%;max-height:72vh;width:auto;height:auto;display:block}.pin{position:absolute;transform:translate(-50%,-100%);border:0;background:#fff;border-radius:50%;padding:4px;cursor:pointer;font-size:20px;line-height:1.2;box-shadow:0 1px 7px #0004}.pin:focus-visible{outline:3px solid #2563eb}.result{display:block;width:100%;text-align:left;background:white;border:1px solid #e2e8f0;border-radius:9px;padding:10px;margin:7px 0;cursor:pointer}.result:hover{background:#eff6ff}.muted{font-size:13px;color:#64748b}.message{margin-top:12px;font-size:13px;color:#334155}.notice{font-size:13px;background:#eff6ff;padding:12px;border-radius:9px;margin-bottom:15px}@media(max-width:780px){main{grid-template-columns:1fr}.map{min-height:250px}header{padding:20px}}
</style></head><body><header><h1>교내 편의시설 통합 지도</h1><p>건물과 층을 선택해 편의시설 위치를 확인하세요.</p></header><main><aside class="card"><h2>시설 찾기</h2><input id="search" placeholder="건물·시설명 검색" aria-label="시설 검색"><div id="results"></div><p class="muted" id="count"></p></aside><section class="card"><div class="notice">학생·팀원용 열람 화면입니다. 도면과 핀 수정은 관리자용 HTML에서 진행합니다.</div><div class="row"><div><label for="building">건물</label><select id="building"></select></div><div><label for="floor">층</label><select id="floor"></select></div></div><div class="legend">🥤 자판기　💧 정수기　🪑 휴게공간　🖨️ 프린터기　🏧 ATM기　🧩 기타</div><div class="map" id="map"><span class="muted">도면을 불러오는 중...</span></div><p class="message" id="message" role="status"></p></section></main><script>
const icons={vending:'🥤',water:'💧',rest:'🪑',printer:'🖨️',atm:'🏧',other:'🧩'};const labels={vending:'자판기',water:'정수기',rest:'휴게공간',printer:'프린터기',atm:'ATM기',other:'기타'};
const $=id=>document.getElementById(id);let data={floors:[],pins:[]},current=null;
function floorRank(s){s=String(s||'').toLowerCase().replace(/\s+/g,'');let m=s.match(/(?:지하|b)(\d+)/);if(m)return -Number(m[1]);m=s.match(/(\d+)/);return m?Number(m[1]):999}
function sortedFloors(a){return [...a].sort((x,y)=>floorRank(x.floor)-floorRank(y.floor)||String(x.floor).localeCompare(String(y.floor),'ko'))}
function option(sel,value,text){let o=document.createElement('option');o.value=value;o.textContent=text;sel.append(o)}
function setBuilding(){let b=$('building').value,fs=sortedFloors(data.floors.filter(f=>f.building===b));$('floor').replaceChildren();fs.forEach(f=>option($('floor'),f.id,f.floor));current=fs[0]?.id||null;draw()}
function selectFloor(id){let f=data.floors.find(f=>f.id===id);if(!f)return;$('building').value=f.building;let fs=sortedFloors(data.floors.filter(x=>x.building===f.building));$('floor').replaceChildren();fs.forEach(x=>option($('floor'),x.id,x.floor));$('floor').value=id;current=id;draw()}
function draw(){const el=$('map');el.replaceChildren();let f=data.floors.find(f=>f.id===current);if(!f){el.textContent='등록된 도면이 없습니다.';return}if(!f.image){el.textContent='이 층에는 도면 이미지가 없습니다.';return}let stage=document.createElement('div');stage.className='stage';let img=document.createElement('img');img.src=f.image;img.alt=f.building+' '+f.floor+' 도면';stage.append(img);data.pins.filter(p=>p.floorId===f.id).forEach(p=>{let b=document.createElement('button');b.className='pin';b.style.left=(Number(p.x)*100)+'%';b.style.top=(Number(p.y)*100)+'%';b.textContent=icons[p.cat]||'🧩';b.title=p.name||labels[p.cat]||'기타';b.setAttribute('aria-label',b.title);b.onclick=()=>$('message').textContent=(p.name||labels[p.cat]||'기타')+' · '+f.building+' '+f.floor;stage.append(b)});el.append(stage);$('message').textContent=f.building+' · '+f.floor}
function search(){let q=$('search').value.trim().toLocaleLowerCase('ko'),results=$('results');results.replaceChildren();let matches=data.pins.filter(p=>{let f=data.floors.find(f=>f.id===p.floorId);return f&&[p.name,labels[p.cat],f.building,f.floor].some(s=>String(s||'').toLocaleLowerCase('ko').includes(q))});$('count').textContent='검색 결과 '+matches.length+'개';matches.slice(0,100).forEach(p=>{let f=data.floors.find(f=>f.id===p.floorId);let b=document.createElement('button');b.className='result';b.textContent=(icons[p.cat]||'🧩')+' '+(p.name||labels[p.cat]||'기타')+' — '+f.building+' '+f.floor;b.onclick=()=>selectFloor(f.id);results.append(b)});if(matches.length>100){let p=document.createElement('p');p.className='muted';p.textContent='처음 100개 결과만 표시합니다.';results.append(p)}}
$('building').onchange=setBuilding;$('floor').onchange=()=>{current=$('floor').value;draw()};$('search').oninput=search;
(async()=>{try{let r=await fetch('./data.json',{cache:'no-store'});if(!r.ok)throw Error('HTTP '+r.status);let d=await r.json();if(!Array.isArray(d.floors)||!Array.isArray(d.pins))throw Error('JSON 형식이 올바르지 않습니다.');data=d;let buildings=[...new Set(data.floors.map(f=>f.building))].sort((a,b)=>a.localeCompare(b,'ko'));buildings.forEach(b=>option($('building'),b,b));if(buildings.length)setBuilding();else $('map').textContent='아직 등록된 도면이 없습니다. 관리자용 지도에서 JSON을 내보내 data.json으로 올려주세요.';search()}catch(e){$('map').textContent='data.json을 불러오지 못했습니다.';$('message').textContent='GitHub에 index.html과 data.json을 같은 위치에 올렸는지 확인하세요. ('+e.message+')'}})();
</script></body></html>
